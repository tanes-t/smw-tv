<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071214"/>
      <stop offset="50%" stop-color="#0c1d20"/>
      <stop offset="100%" stop-color="#050d0e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#10ac84"/>
    </linearGradient>
    <pattern id="grid02" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,210,211,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg02)"/>
  <rect width="800" height="450" fill="url(#grid02)"/>
  <circle cx="260" cy="220" r="150" fill="#00d2d3" opacity="0.07" filter="blur(40px)"/>

  <!-- Left: Precision Caliper & Part Measurement Graphic -->
  <g transform="translate(60, 110)">
    <!-- Inspected Part (Bracket Silhouette) -->
    <path d="M 80 180 L 140 180 L 140 120 L 220 120 L 220 180 L 260 180 L 260 210 L 80 210 Z" fill="#1b2d30" stroke="#00d2d3" stroke-width="1.5"/>
    <circle cx="110" cy="195" r="8" fill="#071214" stroke="#00d2d3" stroke-width="1.2"/>
    <circle cx="240" cy="195" r="8" fill="#071214" stroke="#00d2d3" stroke-width="1.2"/>

    <!-- Caliper Body & Scale -->
    <rect x="20" y="70" width="280" height="24" rx="3" fill="#142629" stroke="#254a4f" stroke-width="1.5"/>
    <!-- Caliper Jaws -->
    <path d="M 60 70 L 60 190 L 80 190 L 80 94 L 20 94" fill="#1e3a3f" stroke="#366b72" stroke-width="1.5"/>
    <path d="M 220 70 L 220 190 L 200 190 L 200 94 L 280 94" fill="#1e3a3f" stroke="#366b72" stroke-width="1.5"/>

    <!-- Digital Readout Display -->
    <rect x="110" y="50" width="120" height="40" rx="4" fill="#09181a" stroke="#00d2d3" stroke-width="1.5"/>
    <text x="170" y="76" fill="#00d2d3" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">140.02 mm</text>
    <text x="170" y="44" fill="#88c3c7" font-family="monospace" font-size="9" text-anchor="middle">TOLERANCE ±0.05</text>

    <!-- Dimension Arrow -->
    <line x1="80" y1="165" x2="220" y2="165" stroke="#00d2d3" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="80" cy="165" r="3" fill="#00d2d3"/>
    <circle cx="220" cy="165" r="3" fill="#00d2d3"/>
    <text x="150" y="160" fill="#00d2d3" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">PASS [140.00 NOMINAL]</text>
  </g>

  <!-- Right: QA Inspection Charts & Stats -->
  <g transform="translate(420, 110)">
    <!-- Card 1: Bell Curve Normal Distribution -->
    <rect x="0" y="0" width="320" height="135" rx="8" fill="#0a1a1c" stroke="rgba(0,210,211,0.2)" stroke-width="1"/>
    <text x="16" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">TOLERANCE DISTRIBUTION (Cpk: 1.67)</text>
    
    <!-- Distribution Curve -->
    <path d="M 30 110 Q 120 110 140 70 Q 160 35 170 35 Q 180 35 200 70 Q 220 110 290 110" fill="none" stroke="#00d2d3" stroke-width="2.5"/>
    <line x1="170" y1="35" x2="170" y2="115" stroke="#10ac84" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="175" y="50" fill="#10ac84" font-family="monospace" font-size="9">MEAN (0.00)</text>

    <!-- Upper and Lower Spec Limits -->
    <line x1="80" y1="40" x2="80" y2="115" stroke="#ff4757" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="85" y="55" fill="#ff4757" font-family="monospace" font-size="8">LSL -0.05</text>
    <line x1="260" y1="40" x2="260" y2="115" stroke="#ff4757" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="230" y="55" fill="#ff4757" font-family="monospace" font-size="8">USL +0.05</text>

    <!-- Card 2: PPM & Pass Rate -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="152" height="85" rx="6" fill="#0a1a1c" stroke="rgba(0,210,211,0.2)" stroke-width="1"/>
      <text x="14" y="24" fill="#88c3c7" font-family="sans-serif" font-size="10" font-weight="700">DEFECT RATE</text>
      <text x="14" y="54" fill="#00d2d3" font-family="sans-serif" font-size="22" font-weight="900">142 PPM</text>
      <text x="14" y="72" fill="#10ac84" font-family="sans-serif" font-size="10">● TARGET &lt; 950 PPM</text>

      <rect x="168" y="0" width="152" height="85" rx="6" fill="#0a1a1c" stroke="rgba(0,210,211,0.2)" stroke-width="1"/>
      <text x="182" y="24" fill="#88c3c7" font-family="sans-serif" font-size="10" font-weight="700">PASS RATIO</text>
      <text x="182" y="54" fill="#10ac84" font-family="sans-serif" font-size="22" font-weight="900">99.85%</text>
      <text x="182" y="72" fill="#88c3c7" font-family="sans-serif" font-size="10">ISO 9001 COMPLIANT</text>
    </g>
  </g>

  <!-- Top Channel Header Badge -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#00d2d3"/>
    <text x="35" y="16" fill="#071214" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">CH 02</text>
    <text x="82" y="17" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="1">QA/QC LIVE • QUALITY ASSURANCE</text>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <text x="40" y="420" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="10">SMW-TV INFOGRAPHIC SYSTEM // PRECISION DIMENSIONAL TELEMETRY // NODE: QA-LAB-01</text>
</svg>
