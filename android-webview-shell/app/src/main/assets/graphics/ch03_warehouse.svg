<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c04"/>
      <stop offset="50%" stop-color="#1c1407"/>
      <stop offset="100%" stop-color="#0a0702"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <pattern id="grid03" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,159,67,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg03)"/>
  <rect width="800" height="450" fill="url(#grid03)"/>
  <circle cx="260" cy="220" r="150" fill="#ff9f43" opacity="0.07" filter="blur(40px)"/>

  <!-- Left: Industrial High-Bay Racking Graphic -->
  <g transform="translate(60, 110)">
    <!-- Floor Base -->
    <line x1="10" y1="230" x2="310" y2="230" stroke="#ff9f43" stroke-width="2"/>

    <!-- Vertical Upright Beams -->
    <rect x="20" y="30" width="8" height="200" fill="#2d2010" stroke="#ff9f43" stroke-width="1"/>
    <rect x="110" y="30" width="8" height="200" fill="#2d2010" stroke="#ff9f43" stroke-width="1"/>
    <rect x="200" y="30" width="8" height="200" fill="#2d2010" stroke="#ff9f43" stroke-width="1"/>
    <rect x="290" y="30" width="8" height="200" fill="#2d2010" stroke="#ff9f43" stroke-width="1"/>

    <!-- Horizontal Shelf Beams -->
    <rect x="20" y="80" width="278" height="6" fill="#ff9f43" opacity="0.9"/>
    <rect x="20" y="130" width="278" height="6" fill="#ff9f43" opacity="0.9"/>
    <rect x="20" y="180" width="278" height="6" fill="#ff9f43" opacity="0.9"/>

    <!-- Pallets with Cargo -->
    <!-- Level 3 -->
    <rect x="36" y="44" width="66" height="36" rx="2" fill="#3d2a13" stroke="#f39c12" stroke-width="1"/>
    <rect x="126" y="44" width="66" height="36" rx="2" fill="#3d2a13" stroke="#f39c12" stroke-width="1"/>
    <rect x="216" y="44" width="66" height="36" rx="2" fill="#3d2a13" stroke="#f39c12" stroke-width="1"/>
    <!-- Level 2 -->
    <rect x="36" y="94" width="66" height="36" rx="2" fill="#ff9f43" opacity="0.8"/>
    <rect x="126" y="94" width="66" height="36" rx="2" fill="#3d2a13" stroke="#f39c12" stroke-width="1"/>
    <!-- Level 1 -->
    <rect x="36" y="144" width="66" height="36" rx="2" fill="#3d2a13" stroke="#f39c12" stroke-width="1"/>
    <rect x="126" y="144" width="66" height="36" rx="2" fill="#ff9f43" opacity="0.8"/>
    <rect x="216" y="144" width="66" height="36" rx="2" fill="#3d2a13" stroke="#f39c12" stroke-width="1"/>

    <!-- Barcode Scanning Beam on Active Pallet -->
    <line x1="30" y1="112" x2="110" y2="112" stroke="#ff4757" stroke-width="2"/>
    <text x="145" y="24" fill="#ff9f43" font-family="monospace" font-size="9" font-weight="700">RACK ZONE B • RFID SCAN</text>
  </g>

  <!-- Right: Storage Telemetry & Stock Capacity -->
  <g transform="translate(420, 110)">
    <!-- Card 1: Warehouse Storage Density -->
    <rect x="0" y="0" width="320" height="135" rx="8" fill="#181107" stroke="rgba(255,159,67,0.2)" stroke-width="1"/>
    <text x="16" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">STORAGE OCCUPANCY MATRIX</text>
    <text x="235" y="25" fill="#ff9f43" font-family="monospace" font-size="11" font-weight="800">84.6% USED</text>

    <!-- Mini Bay Grid Graphic -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="46" y="0" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="92" y="0" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="138" y="0" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="184" y="0" width="40" height="20" rx="2" fill="#2d2010" stroke="#ff9f43"/>
      <rect x="230" y="0" width="40" height="20" rx="2" fill="#ff9f43"/>

      <rect x="0" y="26" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="46" y="26" width="40" height="20" rx="2" fill="#2d2010" stroke="#ff9f43"/>
      <rect x="92" y="26" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="138" y="26" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="184" y="26" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="230" y="26" width="40" height="20" rx="2" fill="#2d2010" stroke="#ff9f43"/>

      <rect x="0" y="52" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="46" y="52" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="92" y="52" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="138" y="52" width="40" height="20" rx="2" fill="#2d2010" stroke="#ff9f43"/>
      <rect x="184" y="52" width="40" height="20" rx="2" fill="#ff9f43"/>
      <rect x="230" y="52" width="40" height="20" rx="2" fill="#ff9f43"/>
    </g>

    <!-- Card 2: Warehouse Metrics -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="152" height="85" rx="6" fill="#181107" stroke="rgba(255,159,67,0.2)" stroke-width="1"/>
      <text x="14" y="24" fill="#cfa878" font-family="sans-serif" font-size="10" font-weight="700">PALLETS IN STOCK</text>
      <text x="14" y="54" fill="#ff9f43" font-family="sans-serif" font-size="22" font-weight="900">1,420</text>
      <text x="14" y="72" fill="#46d369" font-family="sans-serif" font-size="10">● 180 BAYS FREE</text>

      <rect x="168" y="0" width="152" height="85" rx="6" fill="#181107" stroke="rgba(255,159,67,0.2)" stroke-width="1"/>
      <text x="182" y="24" fill="#cfa878" font-family="sans-serif" font-size="10" font-weight="700">FULFILLMENT</text>
      <text x="182" y="54" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">96.8%</text>
      <text x="182" y="72" fill="#46d369" font-family="sans-serif" font-size="10">ON-TIME DELIVERY</text>
    </g>
  </g>

  <!-- Top Channel Header Badge -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#ff9f43"/>
    <text x="35" y="16" fill="#120c04" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">CH 03</text>
    <text x="82" y="17" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="1">WAREHOUSE LIVE • INVENTORY &amp; LOGISTICS</text>
  </g>

  <!-- Bottom Technical Footer Bar -->
  <text x="40" y="420" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="10">SMW-TV INFOGRAPHIC SYSTEM // SMART WAREHOUSE &amp; PALLET MATRIX // NODE: WH-HUB-01</text>
</svg>
