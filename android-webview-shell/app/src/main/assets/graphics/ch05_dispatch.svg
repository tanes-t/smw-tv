<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0816"/>
      <stop offset="50%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#07050f"/>
    </linearGradient>
    <pattern id="grid05" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(95,39,205,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg05)"/>
  <rect width="800" height="450" fill="url(#grid05)"/>
  <circle cx="260" cy="220" r="150" fill="#5f27cd" opacity="0.1" filter="blur(40px)"/>

  <!-- Left: Logistics Cargo Truck & Route Map Blueprint -->
  <g transform="translate(60, 110)">
    <!-- Road Line -->
    <line x1="10" y1="210" x2="310" y2="210" stroke="#5f27cd" stroke-width="2"/>
    <line x1="10" y1="218" x2="310" y2="218" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="8,6"/>

    <!-- Truck Cab -->
    <path d="M 210 210 L 210 130 L 255 130 L 280 160 L 280 210 Z" fill="#20153f" stroke="#7d5fff" stroke-width="1.5"/>
    <rect x="250" y="140" width="22" height="20" rx="2" fill="#5f27cd" opacity="0.6"/>
    <!-- Headlight beam -->
    <polygon points="280,185 330,175 330,215 280,205" fill="#7d5fff" opacity="0.15"/>

    <!-- Trailer Cargo Container -->
    <rect x="30" y="90" width="175" height="120" rx="3" fill="#170e30" stroke="#5f27cd" stroke-width="1.5"/>
    <!-- Cargo Corrugated Vertical Ribs -->
    <line x1="55" y1="90" x2="55" y2="210" stroke="rgba(125,95,255,0.3)" stroke-width="1"/>
    <line x1="80" y1="90" x2="80" y2="210" stroke="rgba(125,95,255,0.3)" stroke-width="1"/>
    <line x1="105" y1="90" x2="105" y2="210" stroke="rgba(125,95,255,0.3)" stroke-width="1"/>
    <line x1="130" y1="90" x2="130" y2="210" stroke="rgba(125,95,255,0.3)" stroke-width="1"/>
    <line x1="155" y1="90" x2="155" y2="210" stroke="rgba(125,95,255,0.3)" stroke-width="1"/>
    <line x1="180" y1="90" x2="180" y2="210" stroke="rgba(125,95,255,0.3)" stroke-width="1"/>

    <!-- Truck Wheels -->
    <circle cx="65" cy="210" r="14" fill="#0d081b" stroke="#7d5fff" stroke-width="2"/>
    <circle cx="100" cy="210" r="14" fill="#0d081b" stroke="#7d5fff" stroke-width="2"/>
    <circle cx="235" cy="210" r="14" fill="#0d081b" stroke="#7d5fff" stroke-width="2"/>

    <!-- GPS Waypoint Target Pin -->
    <g transform="translate(118, 50)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#7d5fff" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="0" cy="0" r="6" fill="#ff4757"/>
      <text x="24" y="4" fill="#7d5fff" font-family="monospace" font-size="9" font-weight="700">GPS TRUCK 72-5401</text>
    </g>
  </g>

  <!-- Right: Dispatch Logistics & Schedule Matrix -->
  <g transform="translate(420, 110)">
    <!-- Card 1: Active Trips Radar -->
    <rect x="0" y="0" width="320" height="135" rx="8" fill="#120c24" stroke="rgba(95,39,205,0.3)" stroke-width="1"/>
    <text x="16" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">DISPATCH SCHEDULE &amp; TRIPS</text>
    <text x="245" y="25" fill="#46d369" font-family="monospace" font-size="10" font-weight="800">4 TRIPS LIVE</text>

    <!-- Trip Progress Bars -->
    <g transform="translate(16, 45)">
      <text x="0" y="10" fill="#a493d4" font-family="monospace" font-size="9">72-5401 (EASTERN SEABOARD)</text>
      <rect x="0" y="16" width="288" height="6" rx="3" fill="#20153f"/>
      <rect x="0" y="16" width="220" height="6" rx="3" fill="#7d5fff"/>

      <text x="0" y="42" fill="#a493d4" font-family="monospace" font-size="9">70-9812 (BANG PHLI DC)</text>
      <rect x="0" y="48" width="288" height="6" rx="3" fill="#20153f"/>
      <rect x="0" y="48" width="160" height="6" rx="3" fill="#7d5fff"/>

      <text x="0" y="74" fill="#a493d4" font-family="monospace" font-size="9">71-3320 (LAEM CHABANG PORT)</text>
      <rect x="0" y="80" width="288" height="6" rx="3" fill="#20153f"/>
      <rect x="0" y="80" width="60" height="6" rx="3" fill="#ff9f43"/>
    </g>

    <!-- Card 2: Cargo Weight & Fleet On-Time -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="152" height="85" rx="6" fill="#120c24" stroke="rgba(95,39,205,0.3)" stroke-width="1"/>
      <text x="14" y="24" fill="#a493d4" font-family="sans-serif" font-size="10" font-weight="700">CARGO DISPATCHED</text>
      <text x="14" y="54" fill="#7d5fff" font-family="sans-serif" font-size="22" font-weight="900">41.7 T</text>
      <text x="14" y="72" fill="#46d369" font-family="sans-serif" font-size="10">● ALL SECURED</text>

      <rect x="168" y="0" width="152" height="85" rx="6" fill="#120c24" stroke="rgba(95,39,205,0.3)" stroke-width="1"/>
      <text x="182" y="24" fill="#a493d4" font-family="sans-serif" font-size="10" font-weight="700">ON-TIME RATE</text>
      <text x="182" y="54" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">99.1%</text>
      <text x="182" y="72" fill="#46d369" font-family="sans-serif" font-size="10">ESTIMATED ETA PASS</text>
    </g>
  </g>

  <!-- Top Channel Header Badge -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#5f27cd"/>
    <text x="35" y="16" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">CH 05</text>
    <text x="82" y="17" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="1">DISPATCH LIVE • FLEET &amp; LOGISTICS</text>
  </g>

  <text x="40" y="420" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="10">SMW-TV INFOGRAPHIC SYSTEM // FLEET LOGISTICS GPS ROUTING // NODE: LOGISTICS-01</text>
</svg>
