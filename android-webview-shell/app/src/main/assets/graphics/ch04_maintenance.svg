<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e17"/>
      <stop offset="50%" stop-color="#0c1929"/>
      <stop offset="100%" stop-color="#040910"/>
    </linearGradient>
    <pattern id="grid04" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(46,134,222,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg04)"/>
  <rect width="800" height="450" fill="url(#grid04)"/>
  <circle cx="240" cy="220" r="150" fill="#2e86de" opacity="0.08" filter="blur(40px)"/>

  <!-- Left: Machine Gears & Wrench Engineering Blueprint -->
  <g transform="translate(60, 110)">
    <!-- Big Gear -->
    <g transform="translate(130, 120)">
      <circle cx="0" cy="0" r="70" fill="#132338" stroke="#2e86de" stroke-width="2"/>
      <circle cx="0" cy="0" r="48" fill="#091422" stroke="#54a0ff" stroke-width="1.5" stroke-dasharray="4,3"/>
      <circle cx="0" cy="0" r="22" fill="#132338" stroke="#2e86de" stroke-width="2"/>
      <!-- Gear Teeth -->
      <path d="M -12 -78 L 12 -78 L 8 -68 L -8 -68 Z" fill="#2e86de"/>
      <path d="M -12 78 L 12 78 L 8 68 L -8 68 Z" fill="#2e86de"/>
      <path d="M -78 -12 L -78 12 L -68 8 L -68 -8 Z" fill="#2e86de"/>
      <path d="M 78 -12 L 78 12 L 68 8 L 68 -8 Z" fill="#2e86de"/>
      <path d="M -58 -58 L -42 -42 L -36 -48 L -52 -64 Z" fill="#2e86de"/>
      <path d="M 58 58 L 42 42 L 36 48 L 52 64 Z" fill="#2e86de"/>
      <path d="M -58 58 L -42 42 L -48 36 L -64 52 Z" fill="#2e86de"/>
      <path d="M 58 -58 L 42 -42 L 48 -36 L 64 -52 Z" fill="#2e86de"/>
      <!-- Center Axle Axis Lines -->
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#54a0ff" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="0" y1="-80" x2="0" y2="80" stroke="#54a0ff" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Small Interlocking Gear -->
    <g transform="translate(230, 60)">
      <circle cx="0" cy="0" r="40" fill="#132338" stroke="#54a0ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="14" fill="#091422" stroke="#2e86de" stroke-width="1.5"/>
      <path d="M -8 -46 L 8 -46 L 6 -38 L -6 -38 Z" fill="#54a0ff"/>
      <path d="M -8 46 L 8 46 L 6 38 L -6 38 Z" fill="#54a0ff"/>
      <path d="M -46 -8 L -46 8 L -38 6 L -38 -6 Z" fill="#54a0ff"/>
      <path d="M 46 -8 L 46 8 L 38 6 L 38 -6 Z" fill="#54a0ff"/>
    </g>

    <!-- Spanner Wrench Icon Silhouette -->
    <path d="M 20 200 L 70 150 L 80 160 L 30 210 Z" fill="#3b567a"/>
    <circle cx="20" cy="210" r="12" fill="none" stroke="#54a0ff" stroke-width="3"/>

    <text x="50" y="235" fill="#54a0ff" font-family="monospace" font-size="9" font-weight="700">PREVENTIVE MAINTENANCE • GEARBOX #4</text>
  </g>

  <!-- Right: Vibration Sensor & MTBF Status -->
  <g transform="translate(420, 110)">
    <!-- Card 1: Machine Health Vibration Spectrum -->
    <rect x="0" y="0" width="320" height="135" rx="8" fill="#0b1726" stroke="rgba(46,134,222,0.25)" stroke-width="1"/>
    <text x="16" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">VIBRATION &amp; HEALTH TELEMETRY</text>
    <text x="240" y="25" fill="#46d369" font-family="monospace" font-size="10" font-weight="800">NORMAL (PASS)</text>

    <!-- Sine Wave Oscillation -->
    <path d="M 20 80 Q 40 40 60 80 T 100 80 T 140 80 T 180 80 T 220 80 T 260 80 T 300 80" fill="none" stroke="#2e86de" stroke-width="2"/>
    <line x1="20" y1="50" x2="300" y2="50" stroke="#ff4757" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="230" y="45" fill="#ff4757" font-family="monospace" font-size="8">MAX VIB 2.8 mm/s</text>
    <text x="20" y="115" fill="#7fa9d4" font-family="monospace" font-size="9">PEAK VELOCITY: 1.12 mm/s • BEARING TEMP: 48°C</text>

    <!-- Card 2: PM Schedule & MTBF -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="152" height="85" rx="6" fill="#0b1726" stroke="rgba(46,134,222,0.25)" stroke-width="1"/>
      <text x="14" y="24" fill="#7fa9d4" font-family="sans-serif" font-size="10" font-weight="700">MTBF RECORD</text>
      <text x="14" y="54" fill="#54a0ff" font-family="sans-serif" font-size="22" font-weight="900">482 hrs</text>
      <text x="14" y="72" fill="#46d369" font-family="sans-serif" font-size="10">● ZERO BREAKDOWN</text>

      <rect x="168" y="0" width="152" height="85" rx="6" fill="#0b1726" stroke="rgba(46,134,222,0.25)" stroke-width="1"/>
      <text x="182" y="24" fill="#7fa9d4" font-family="sans-serif" font-size="10" font-weight="700">PM SCHEDULE</text>
      <text x="182" y="54" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">100%</text>
      <text x="182" y="72" fill="#46d369" font-family="sans-serif" font-size="10">PLAN COMPLETED</text>
    </g>
  </g>

  <!-- Top Channel Header Badge -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#2e86de"/>
    <text x="35" y="16" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">CH 04</text>
    <text x="82" y="17" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="1">MAINTENANCE LIVE • PLANT ENGINEERING</text>
  </g>

  <text x="40" y="420" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="10">SMW-TV INFOGRAPHIC SYSTEM // PREDICTIVE MAINTENANCE &amp; VIBRATION SENSORS // NODE: PM-ENG-01</text>
</svg>
