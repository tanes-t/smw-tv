<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" fill="none">
  <!-- Deep Architectural Frame #0B0D12 -->
  <rect width="640" height="320" fill="#0B0D12"/>

  <!-- Subtle Ambient Glow Behind Text -->
  <circle cx="320" cy="160" r="180" fill="#E50914" fill-opacity="0.08" filter="blur(30px)"/>

  <!-- "SMW" Wordmark -->
  <text x="140" y="180" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="90" font-weight="900" fill="#FFFFFF" letter-spacing="-2">SMW</text>

  <!-- "TV" Red Badge -->
  <rect x="420" y="120" width="94" height="64" rx="14" fill="#E50914"/>
  <text x="467" y="167" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TV</text>

  <!-- Tagline Subtitle -->
  <text x="142" y="216" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#94A3B8" letter-spacing="2.2">SIAM METALWORK • INDUSTRIAL TELEMETRY</text>

  <!-- Live Telemetry Status Pill -->
  <circle cx="148" cy="241" r="5" fill="#10B981"/>
  <text x="162" y="245" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#10B981" letter-spacing="1.5">REAL-TIME PRODUCTION STREAM</text>
</svg>
